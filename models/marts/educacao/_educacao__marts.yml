version: 2

models:

  - name: dim_educacao__escola
    description: >
      Dimensao de escolas: cadastro completo (1.558), com flag de quais tem alunos nesta extracao.
      Grao: 1 linha por escola.
    config:
      contract:
        enforced: true
    columns:
      - name: id_escola
        data_type: int64
        description: "Chave da escola."
        data_tests:
          - unique
          - not_null
        constraints:
          - type: not_null
      - name: bairro_escola_hash
        data_type: int64
        description: "Bairro da escola anonimizado."
      - name: qtd_turmas
        data_type: int64
        description: "Turmas da escola (via frequencia)."
      - name: qtd_alunos_matriculados
        data_type: int64
        description: "Alunos cuja turma de matricula pertence a esta escola."
      - name: possui_alunos_na_extracao
        data_type: bool
        description: "FALSE = escola so existe no cadastro (sem alunos nesta extracao)."
        data_tests:
          - not_null

  - name: fct_educacao__avaliacao_bimestre
    description: >
      Fato da avaliacao bimestral: frequencia, notas e flags de politica por aluno x turma x bimestre.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_aluno, id_turma, bimestre]
    columns:
      - name: id_aluno
        data_type: string
        data_tests:
          - not_null
        constraints:
          - type: not_null
      - name: id_turma
        data_type: int64
        data_tests:
          # toda turma do fato existe na dimensao de turmas
          - relationships:
              arguments:
                to: ref('dim_educacao__turma')
                field: id_turma
      - name: id_escola
        data_type: int64
        data_tests:
          # cobertura minima de escola: hoje 81,3%; abaixo de 80% indica perda de chave turma -> escola
          - dbt_utils.not_null_proportion:
              arguments:
                at_least: 0.8
          - relationships:
              arguments:
                to: ref('dim_educacao__escola')
                field: id_escola
        description: Escola via turma (avaliada ou de matricula). Nula = nao identificada com seguranca.
      - name: bimestre
        data_type: int64
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
        constraints:
          - type: not_null
      - name: origem_escola
        data_type: string
      - name: faixa_etaria
        data_type: string
      - name: ordem_faixa_etaria
        data_type: int64
      - name: avaliado_fora_da_turma_matricula
        data_type: bool
      - name: frequencia_bimestre_pct
        data_type: float64
        description: "Frequencia do bimestre, 0 a 100 (0,8% nulos na origem)."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100

      - name: abaixo_minimo_legal
        data_type: bool
      - name: em_absenteismo_cronico
        data_type: bool
      - name: faltas_estimadas_bimestre
        data_type: float64
      - name: nota_disciplina_1
        data_type: float64
      - name: nota_disciplina_2
        data_type: float64
      - name: nota_disciplina_3
        data_type: float64
      - name: nota_disciplina_4
        data_type: float64
      - name: qtd_disciplinas_com_nota
        data_type: int64
      - name: nota_media_bimestre
        data_type: float64
      - name: tem_nota_baixa
        data_type: bool
      - name: registro_conflitante
        data_type: bool

  - name: mart_educacao__absenteismo_escola_bimestre
    description: >
      Absenteismo por escola e bimestre, para priorizar busca ativa e acompanhamento. Base: avaliacao bimestral (cobre sobretudo alunos de 15-17; ver pct_alunos_15_17). Grao: escola x bimestre. Exclui registros com escola nao identificada (18,7%).
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_escola, bimestre]
    columns:
      - name: id_escola
        data_type: int64
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_educacao__escola')
                field: id_escola
        constraints:
          - type: not_null
      - name: bimestre
        data_type: int64
        data_tests:
          - not_null
        constraints:
          - type: not_null
      - name: bairro_escola_hash
        data_type: int64
      - name: qtd_alunos_avaliados
        data_type: int64
        description: "Tamanho da base da linha. Ler sempre junto com as taxas."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: pct_alunos_15_17
        data_type: float64
        description: "Composicao da base: % de alunos de 15-17 anos."
      - name: frequencia_media_pct
        data_type: float64
        description: "Media simples da frequencia bimestral dos registros."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: qtd_alunos_abaixo_minimo_legal
        data_type: int64
      - name: pct_alunos_abaixo_minimo_legal
        data_type: float64
        description: "% de alunos abaixo de var('limite_frequencia_legal') (75%, LDB)."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: qtd_alunos_absenteismo_cronico
        data_type: int64
      - name: pct_alunos_absenteismo_cronico
        data_type: float64
        description: "% de alunos abaixo de var('limite_absenteismo_cronico') (90%)."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: amostra_pequena
        data_type: bool
        description: "TRUE se qtd_alunos_avaliados < var('tamanho_minimo_amostra'): taxa instavel."
        data_tests:
          - not_null
      - name: pct_registros_via_turma_matricula
        data_type: float64
        description: "% dos registros ligados a escola pela turma de matricula (e nao pela turma avaliada)."

  - name: mart_educacao__frequencia_desempenho
    description: >
      Curva frequencia x desempenho: para cada faixa de 5 p.p. de frequencia bimestral, a nota media
      e o % de registros com nota baixa, separados por grupo etario (15-17 x demais).
      Serve para validar localmente os limiares do alerta precoce. Associacao, nao causa.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grupo_etario, faixa_frequencia_inicio]
    columns:
      - name: grupo_etario
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['15-17', 'demais']
        constraints:
          - type: not_null
      - name: faixa_frequencia_inicio
        data_type: int64
        description: "Inicio da faixa de 5 p.p. (0, 5, ..., 95). A faixa 95 inclui 100."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 95
        constraints:
          - type: not_null
      - name: faixa_frequencia_fim
        data_type: int64
      - name: qtd_registros
        data_type: int64
        description: "Registros aluno x turma x bimestre na faixa."
      - name: qtd_alunos
        data_type: int64
      - name: nota_media
        data_type: float64
      - name: qtd_registros_nota_baixa
        data_type: int64
      - name: pct_registros_nota_baixa
        data_type: float64
        description: "% de registros com alguma disciplina abaixo de var('limite_nota_baixa')."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: risco_relativo_nota_baixa
        data_type: float64
        description: "Chance de nota baixa na faixa dividida pela chance na faixa 95-100 (1,0 = igual)."
      - name: amostra_pequena
        data_type: bool
        description: "TRUE se a faixa tem menos de var('tamanho_minimo_amostra') registros."

  - name: dim_educacao__aluno
    description: >
      Dimensao de alunos: faixa etaria, bairro de residencia (hash), turma e escola de matricula e cobertura da avaliacao.
      Grao: 1 linha por aluno. Sem dado identificavel (ids e bairro em hash).
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_educacao__aluno')
    columns:
      - name: id_aluno
        data_type: string
        data_tests:
          - unique
          - not_null
        constraints:
          - type: not_null
      - name: faixa_etaria
        data_type: string
      - name: ordem_faixa_etaria
        data_type: int64
      - name: bairro_residencia_hash
        data_type: int64
      - name: id_turma_matricula
        data_type: int64
        description: Turma de matricula do aluno.
      - name: id_escola_matricula
        data_type: int64
        description: "Escola da turma de matricula. Nula = turma sem escola conhecida."
      - name: possui_avaliacao
        data_type: bool
        description: "FALSE para os 28% sem avaliacao (fora do alerta v1)."
      - name: qtd_bimestres_avaliados
        data_type: int64
        description: "0 a 4. Poucos bimestres refletem o recorte da extracao, nao abandono."
      - name: primeiro_bimestre_avaliado
        data_type: int64
      - name: ultimo_bimestre_avaliado
        data_type: int64

  - name: dim_educacao__turma
    description: "Dimensao de turmas e ponte oficial turma -> escola: turmas de matricula, avaliacao e do catalogo da frequencia. Grao: 1 linha por turma. Escola nula = turma fora do catalogo.\n"
    config:
      contract:
        enforced: true
    columns:
      - name: id_turma
        data_type: int64
        description: Chave da turma.
        data_tests:
          - unique
          - not_null
        constraints:
          - type: not_null
      - name: id_escola
        data_type: int64
        description: Escola da turma (catalogo da frequencia). Nula = nao identificada.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_educacao__escola')
                field: id_escola
      - name: escola_identificada
        data_type: bool
        description: TRUE se a turma tem escola conhecida.
      - name: qtd_alunos_matriculados
        data_type: int64
        description: Alunos com matricula nesta turma.

  - name: mart_educacao__alerta_precoce_aluno_bimestre
    description: >
      Alerta precoce por aluno e bimestre com regras normativas (SME-Rio e LDB): nivel (alto, medio,
      atencao, sem_alerta), motivos em texto e flag de comunicacao ao Conselho Tutelar.
      Grao: aluno x bimestre.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_aluno, bimestre]
      # testes de regra de negocio: a classificacao respeita as regras declaradas
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (sinal_frequencia_busca_ativa and nivel_alerta != 'alto')"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(nivel_alerta = 'sem_alerta') = (not (sinal_frequencia_atendimento or sinal_nota_baixa or sinal_queda_frequencia))"
    columns:
      - name: id_aluno
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_educacao__aluno')
                field: id_aluno
        constraints:
          - type: not_null
      - name: bimestre
        data_type: int64
        constraints:
          - type: not_null
      - name: id_escola
        data_type: int64
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_educacao__escola')
                field: id_escola
        description: Escola via turma. Nula = nao identificada com seguranca (o aluno continua na lista).
      - name: escola_identificada
        data_type: bool
        description: FALSE = escola nao identificada; a Secretaria resolve com a chave real.
        data_tests:
          - not_null
        constraints:
          - type: not_null
      - name: bairro_residencia_hash
        data_type: int64
        description: Bairro de residencia (hash). Organiza a busca ativa por territorio.
      - name: faixa_etaria
        data_type: string
      - name: nivel_alerta
        data_type: string
        description: "alto (busca ativa) | medio (atendimento individualizado) | atencao | sem_alerta."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['alto', 'medio', 'atencao', 'sem_alerta']
        constraints:
          - type: not_null
      - name: ordem_nivel_alerta
        data_type: int64
      - name: motivos
        data_type: string
        description: "Sinais que levaram ao nivel, em texto, separados por ';'."
      - name: comunicar_conselho_tutelar
        data_type: bool
        description: "15+ faltas estimadas acumuladas (LDB art. 12, VIII; Circular E/SUBAIR 02/2026)."
        data_tests:
          - not_null
      - name: sinal_frequencia_busca_ativa
        data_type: bool
      - name: sinal_frequencia_atendimento
        data_type: bool
      - name: sinal_nota_baixa
        data_type: bool
      - name: sinal_queda_frequencia
        data_type: bool
      - name: frequencia_bimestre_pct
        data_type: float64
      - name: frequencia_acumulada_pct
        data_type: float64
      - name: variacao_frequencia_pp
        data_type: float64
      - name: faltas_estimadas_acumuladas
        data_type: float64
      - name: nota_media_bimestre
        data_type: float64
      - name: tem_disciplina_abaixo_limite
        data_type: bool
      - name: qtd_turmas_no_bimestre
        data_type: int64
      - name: qtd_bimestres_ate_aqui
        data_type: int64
      - name: qtd_bimestres_avaliados
        data_type: int64
      - name: registro_conflitante
        data_type: bool

  - name: mart_educacao__alerta_bairro_bimestre
    description: "Alerta precoce por bairro de residencia (hash) e bimestre, com ranking de prioridade (1 = mais alunos em 'alto'). Consumidor: equipes de busca ativa e parceiros territoriais. Grao: bairro x bimestre.\n"
    config:
      contract:
        enforced: true
    data_tests:
      # grao garantido: 1 linha por bairro x bimestre
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - bairro_residencia_hash
              - bimestre
      # niveis sao exclusivos: a soma nao pode passar do total de alunos
      - dbt_utils.expression_is_true:
          arguments:
            expression: qtd_alunos_alto + qtd_alunos_medio + qtd_alunos_atencao <= qtd_alunos_avaliados
    columns:
      - name: bairro_residencia_hash
        data_type: int64
        description: Bairro de residencia (hash). Nulo = bairro nao informado no cadastro (0,07%).
      - name: bimestre
        data_type: int64
        description: Bimestre (1 a 4).
        data_tests:
          - not_null
        constraints:
          - type: not_null
      - name: bairro_informado
        data_type: bool
        description: FALSE para a linha de alunos sem bairro no cadastro.
      - name: ranking_prioridade
        data_type: int64
        description: "Posicao do bairro no bimestre: 1 = mais alunos em 'alto' (desempate: 'medio', depois 'atencao')."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
        constraints:
          - type: not_null
      - name: qtd_alunos_avaliados
        data_type: int64
        description: Alunos avaliados do bairro no bimestre.
      - name: qtd_alunos_alto
        data_type: int64
        description: Alunos em nivel 'alto' (busca ativa).
      - name: qtd_alunos_medio
        data_type: int64
        description: Alunos em nivel 'medio' (atendimento individualizado).
      - name: qtd_alunos_atencao
        data_type: int64
        description: Alunos em nivel 'atencao' (queda de frequencia).
      - name: pct_alunos_alto
        data_type: float64
        description: "% de alunos do bairro em 'alto'."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: qtd_alunos_comunicar_conselho_tutelar
        data_type: int64
        description: Alunos com 15+ faltas estimadas acumuladas (obrigacao legal).
      - name: qtd_alunos_alto_sem_escola
        data_type: int64
        description: "Alunos em 'alto' com escola nao identificada: o territorio e o unico caminho."
      - name: qtd_escolas
        data_type: int64
        description: Escolas distintas (identificadas) dos alunos do bairro.
      - name: amostra_pequena
        data_type: bool
        description: "TRUE se o bairro tem menos de var('tamanho_minimo_amostra') alunos: percentual instavel."

  - name: mart_educacao__pendencias_qualidade
    description: "Fila de pendencias de qualidade para correcao na origem: 1 linha por registro (ou turma) que viola uma regra, com dimensao de qualidade, responsavel e acao sugerida. Fecha o ciclo de retorno (Secretaria -> escolas). Grao: 1 linha por pendencia.\n"
    config:
      contract:
        enforced: true
    data_tests:
      # so a pendencia de cadastro (turma sem escola) e por turma; as demais apontam o aluno
      - dbt_utils.expression_is_true:
          arguments:
            expression: id_aluno is not null or tipo_pendencia = 'turma_sem_escola'
    columns:
      - name: id_pendencia
        data_type: string
        description: Chave da pendencia (hash de tipo + chaves do registro).
        data_tests:
          # chave da pendencia: evita duplicar a mesma pendencia na fila
          - unique
          - not_null
        constraints:
          - type: not_null
      - name: tipo_pendencia
        data_type: string
        description: 'Tipo: frequencia_versoes_conflitantes, faltas_acima_dias_letivos, avaliacao_versoes_conflitantes, nota_com_frequencia_zero, avaliado_fora_da_turma_matricula, turma_sem_escola.'
        data_tests:
          # tipos fechados: um tipo novo exige regra, responsavel e acao definidos
          - not_null
          - accepted_values:
              arguments:
                values:
                  - frequencia_versoes_conflitantes
                  - faltas_acima_dias_letivos
                  - avaliacao_versoes_conflitantes
                  - nota_com_frequencia_zero
                  - avaliado_fora_da_turma_matricula
                  - turma_sem_escola
        constraints:
          - type: not_null
      - name: dimensao_qualidade
        data_type: string
        description: 'Dimensao DAMA: unicidade, validade, consistencia ou completude.'
        data_tests:
          # dimensoes de qualidade DAMA usadas no README
          - accepted_values:
              arguments:
                values:
                  - unicidade
                  - validade
                  - consistencia
                  - completude
      - name: regra
        data_type: string
        description: Regra violada, em linguagem de gestao.
      - name: responsavel_correcao
        data_type: string
        description: escola | secretaria.
        data_tests:
          # toda pendencia tem um responsavel pela correcao
          - not_null
          - accepted_values:
              arguments:
                values:
                  - escola
                  - secretaria
      - name: acao_sugerida
        data_type: string
        description: O que fazer na origem para corrigir.
      - name: tabela_origem
        data_type: string
        description: Tabela de origem do registro (frequencia ou avaliacao).
      - name: id_escola
        data_type: int64
        description: Escola do registro. Nula em pendencias centrais (turma sem escola) ou sem escola identificada.
        data_tests:
          # a escola da pendencia existe no cadastro
          - relationships:
              arguments:
                to: ref('dim_educacao__escola')
                field: id_escola
      - name: id_turma
        data_type: int64
        description: Turma do registro.
        data_tests:
          # toda pendencia aponta ao menos a turma
          - not_null
      - name: id_aluno
        data_type: string
        description: 'Aluno do registro (na frequencia, identifica a linha da propria tabela: associacao aluno x turma randomizada).'
      - name: bimestre
        data_type: int64
        description: Bimestre (pendencias da avaliacao).
      - name: disciplina
        data_type: string
        description: Disciplina (pendencias da frequencia).
      - name: data_inicio
        data_type: date
        description: Inicio do periodo (pendencias da frequencia).
      - name: data_fim
        data_type: date
        description: Fim do periodo (pendencias da frequencia).
      - name: detalhe
        data_type: string
        description: 'Evidencia da pendencia (ex.: numero de versoes, razao faltas/dia).'

  - name: mart_educacao__pendencias_qualidade_escola
    description: "Resumo da fila de pendencias por escola, com ranking (1 = mais pendencias). A linha com escola nula reune as pendencias centrais (Secretaria). Grao: 1 linha por escola com pendencia.\n"
    config:
      contract:
        enforced: true
    data_tests:
      # o total bate com a soma dos tipos (nenhuma pendencia sem tipo)
      - dbt_utils.expression_is_true:
          arguments:
            expression: qtd_pendencias = qtd_frequencia_versoes_conflitantes + qtd_faltas_acima_dias_letivos + qtd_avaliacao_versoes_conflitantes + qtd_nota_com_frequencia_zero + qtd_avaliado_fora_da_turma_matricula + qtd_turma_sem_escola
    columns:
      - name: id_escola
        data_type: int64
        description: Escola. Nula = pendencias centrais (Secretaria).
        data_tests:
          # 1 linha por escola
          - unique
      - name: escola_identificada
        data_type: bool
        description: FALSE na linha das pendencias centrais.
      - name: ranking_pendencias
        data_type: int64
        description: 1 = escola com mais pendencias (so escolas identificadas).
        data_tests:
          # ranking comeca em 1 (nulo so na linha sem escola)
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: qtd_pendencias
        data_type: int64
        description: Total de pendencias da escola.
      - name: qtd_frequencia_versoes_conflitantes
        data_type: int64
