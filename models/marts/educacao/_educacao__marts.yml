version: 2

models:
  - name: dim_educacao__escola
    description: >
      Dimensao de escolas: cadastro completo (1.558), com flag de quais tem alunos nesta extracao.
      Grao: 1 linha por escola.
    columns:
      - name: id_escola
        description: "Chave da escola."
        data_tests:
          - unique
          - not_null
      - name: bairro_escola_hash
        description: "Bairro da escola anonimizado."
      - name: qtd_turmas
        description: "Turmas da escola (via frequencia)."
      - name: qtd_alunos_referencia
        description: "Alunos cuja escola de referencia (frequencia mais recente) e esta."
      - name: possui_alunos_na_extracao
        description: "FALSE = escola so existe no cadastro (sem alunos nesta extracao)."
        data_tests:
          - not_null

  - name: fct_educacao__avaliacao_bimestre
    description: >
      Fato da avaliacao bimestral: frequencia, notas e flags de politica por aluno x turma x bimestre.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_aluno, id_turma, bimestre]
    columns:
      - name: id_aluno
        data_tests:
          - not_null
      - name: id_escola
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_educacao__escola')
                field: id_escola
      - name: bimestre
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
      - name: frequencia_bimestre_pct
        description: "Frequencia do bimestre, 0 a 100 (0,8% nulos na origem)."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100

  - name: mart_educacao__absenteismo_escola_bimestre
    description: >
      Absenteismo por escola e bimestre, para priorizar busca ativa e acompanhamento.
      Base: avaliacao bimestral (cobre sobretudo alunos de 15-17; ver pct_alunos_15_17).
      Grao: escola x bimestre.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_escola, bimestre]
    columns:
      - name: id_escola
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_educacao__escola')
                field: id_escola
      - name: bimestre
        data_tests:
          - not_null
      - name: qtd_alunos_avaliados
        description: "Tamanho da base da linha. Ler sempre junto com as taxas."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: pct_alunos_15_17
        description: "Composicao da base: % de alunos de 15-17 anos."
      - name: frequencia_media_pct
        description: "Media simples da frequencia bimestral dos registros."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: pct_alunos_abaixo_minimo_legal
        description: "% de alunos abaixo de var('limite_frequencia_legal') (75%, LDB)."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: pct_alunos_absenteismo_cronico
        description: "% de alunos abaixo de var('limite_absenteismo_cronico') (90%)."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: amostra_pequena
        description: "TRUE se qtd_alunos_avaliados < var('tamanho_minimo_amostra'): taxa instavel."
        data_tests:
          - not_null
      - name: pct_registros_escola_via_aluno
        description: "% dos registros ligados a escola pela rota alternativa (aluno), e nao pela turma."
  - name: mart_educacao__frequencia_desempenho
    description: >
      Curva frequencia x desempenho: para cada faixa de 5 p.p. de frequencia bimestral, a nota media
      e o % de registros com nota baixa, separados por grupo etario (15-17 x demais).
      Serve para validar localmente os limiares do alerta precoce. Associacao, nao causa.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [grupo_etario, faixa_frequencia_inicio]
    columns:
      - name: grupo_etario
        data_tests:
          - accepted_values:
              arguments:
                values: ['15-17', 'demais']
      - name: faixa_frequencia_inicio
        description: "Inicio da faixa de 5 p.p. (0, 5, ..., 95). A faixa 95 inclui 100."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 95
      - name: qtd_registros
        description: "Registros aluno x turma x bimestre na faixa."
      - name: pct_registros_nota_baixa
        description: "% de registros com alguma disciplina abaixo de var('limite_nota_baixa')."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: risco_relativo_nota_baixa
        description: "Chance de nota baixa na faixa dividida pela chance na faixa 95-100 (1,0 = igual)."
      - name: amostra_pequena
        description: "TRUE se a faixa tem menos de var('tamanho_minimo_amostra') registros."

  - name: dim_educacao__aluno
    description: >
      Dimensao de alunos: faixa etaria, escola de referencia, mobilidade e cobertura da avaliacao.
      Grao: 1 linha por aluno. Sem dado identificavel (ids e bairro em hash).
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_educacao__aluno')
    columns:
      - name: id_aluno
        data_tests:
          - unique
          - not_null
      - name: id_escola_referencia
        description: "Escola do registro de frequencia mais recente."
        data_tests:
          - not_null
      - name: possui_avaliacao
        description: "FALSE para os 28% sem avaliacao (fora do alerta v1)."
      - name: qtd_bimestres_avaliados
        description: "0 a 4. Poucos bimestres refletem o recorte da extracao, nao abandono."

  - name: mart_educacao__alerta_precoce_aluno_bimestre
    description: >
      Alerta precoce por aluno e bimestre com regras normativas (SME-Rio e LDB): nivel (alto, medio,
      atencao, sem_alerta), motivos em texto e flag de comunicacao ao Conselho Tutelar.
      Grao: aluno x bimestre.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_aluno, bimestre]
      # testes de regra de negocio: a classificacao respeita as regras declaradas
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not (sinal_frequencia_busca_ativa and nivel_alerta != 'alto')"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(nivel_alerta = 'sem_alerta') = (not (sinal_frequencia_atendimento or sinal_nota_baixa or sinal_queda_frequencia))"
    columns:
      - name: id_aluno
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_educacao__aluno')
                field: id_aluno
      - name: id_escola
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_educacao__escola')
                field: id_escola
      - name: nivel_alerta
        description: "alto (busca ativa) | medio (atendimento individualizado) | atencao | sem_alerta."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['alto', 'medio', 'atencao', 'sem_alerta']
      - name: motivos
        description: "Sinais que levaram ao nivel, em texto, separados por ';'."
      - name: comunicar_conselho_tutelar
        description: "15+ faltas estimadas acumuladas (LDB art. 12, VIII; Circular E/SUBAIR 02/2026)."
        data_tests:
          - not_null