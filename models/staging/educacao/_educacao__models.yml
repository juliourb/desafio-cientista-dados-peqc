version: 2

models:
  - name: stg_educacao__aluno
    description: "Aluno padronizado. Grao: 1 linha por aluno. id_aluno convertido de BYTES para hex."
    columns:
      - name: id_aluno
        description: "Hash do aluno em hexadecimal (TO_HEX). Chave primaria."
        data_tests:
          - unique
          - not_null
          - relationships:          # (EDA 1) aluno e turma tem os mesmos pares
              arguments:
                to: ref('stg_educacao__turma')
                field: id_aluno
      - name: id_turma
        description: "Turma atual do aluno."
        data_tests:
          - not_null
      - name: faixa_etaria
        description: "Faixa etaria em texto."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0-5', '6-10', '11-14', '15-17', '18+']
      - name: ordem_faixa_etaria
        description: "1 a 5, para ordenar as faixas. Nulo = faixa nova nao mapeada no CASE."
        data_tests:
          - not_null
      - name: bairro_residencia_hash
        description: "Bairro de residencia anonimizado (0,07% nulos). Nao casa com o bairro da escola."

  - name: stg_educacao__escola
    description: "Escola padronizada. Grao: 1 linha por escola (1.558)."
    columns:
      - name: id_escola
        description: "Hash INT64 da escola. Chave primaria."
        data_tests:
          - unique
          - not_null
      - name: bairro_escola_hash
        description: "Bairro da escola anonimizado (169 distintos)."
        data_tests:
          - not_null

  - name: stg_educacao__turma
    description: "Matricula aluno x turma. Grao: 1 linha por aluno (cada aluno esta em 1 turma)."
    columns:
      - name: id_aluno
        description: "Hash do aluno em hex. Unico nesta tabela."
        data_tests:
          - unique
          - not_null
      - name: id_turma
        description: "Hash INT64 da turma."
        data_tests:
          - not_null
      - name: ano_letivo
        description: "Ano mascarado (sempre 2000)."
        data_tests:
          - accepted_values:
              arguments:
                values: [2000]
                quote: false

  - name: stg_educacao__frequencia
    description: >
      Frequencia por aluno x turma x disciplina x periodo (fev-jul). Copias identicas removidas.
      O valor bruto nao e percentual; use razao_faltas_por_dia ou a frequencia da avaliacao.
    data_tests:
      - dbt_utils.unique_combination_of_columns:   # (EDA 2) duplicatas no grao
          arguments:
            combination_of_columns: [id_aluno, id_turma, disciplina, data_inicio]
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          arguments:
            expression: "data_fim >= data_inicio"
    columns:
      - name: id_aluno
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_educacao__aluno')
                field: id_aluno
      - name: id_turma
        data_tests:
          - not_null
      - name: id_escola
        description: "Escola da turma: unica ligacao turma -> escola."
        data_tests:
          - not_null
          - relationships:          # (EDA 3) toda escola da frequencia existe em escola
              arguments:
                to: ref('stg_educacao__escola')
                field: id_escola
      - name: disciplina
        data_tests:
          - accepted_values:
              arguments:
                values: ['disciplina_1', 'disciplina_2', 'disciplina_3', 'disciplina_4']
      - name: frequencia_valor_bruto
        description: "100 - faltas/dias_letivos (escala nao percentual)."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: razao_faltas_por_dia
        description: "faltas / dias_letivos. Pode passar de 1 se as faltas forem contadas por aula."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

  - name: stg_educacao__avaliacao
    description: "Avaliacao por aluno x turma x bimestre, formato largo. Copias identicas removidas."
    data_tests:
      - dbt_utils.unique_combination_of_columns:   # (EDA 2) duplicatas no grao
          arguments:
            combination_of_columns: [id_aluno, id_turma, bimestre]
          config:
            severity: warn
    columns:
      - name: id_aluno
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_educacao__aluno')
                field: id_aluno
      - name: bimestre
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
      - name: frequencia_bimestre_pct
        description: "Frequencia no bimestre (0-100). Fonte principal de assiduidade. 0,78% nulos."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: nota_disciplina_1
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 10
      - name: nota_disciplina_2
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 10
      - name: nota_disciplina_3
        description: "100% nula nesta extracao."
      - name: nota_disciplina_4
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 10