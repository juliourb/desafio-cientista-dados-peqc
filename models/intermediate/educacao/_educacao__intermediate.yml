version: 2

models:
  - name: int_educacao__turma_escola
    description: >
      Ponte turma -> escola, derivada da frequencia (a tabela turma nao tem id_escola).
      Grao: 1 linha por turma.
    columns:
      - name: id_turma
        description: "Turma. Unica: garante que cada turma pertence a uma so escola (EDA 4)."
        data_tests:
          - unique
          - not_null
      - name: id_escola
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_educacao__escola')
                field: id_escola

  - name: int_educacao__aluno_escola
    description: >
      Escola de matricula do aluno: turma de matricula -> escola pela ponte int_educacao__turma_escola. Grao: 1 linha por aluno. Nao usa a relacao aluno -> escola da frequencia (randomizada; eda/saida_05.txt). Escola nula = turma de matricula sem escola conhecida.
    data_tests:
      - dbt_utils.equal_rowcount:          # 1 linha por aluno: o left join nao perde nem duplica alunos
          arguments:
            compare_model: ref('stg_educacao__aluno')
    columns:
      - name: id_aluno
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_educacao__aluno')
                field: id_aluno
      - name: id_turma_matricula
        description: Turma de matricula do aluno (stg_educacao__aluno.id_turma).
      - name: id_escola
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_educacao__escola')
                field: id_escola
        description: Escola da turma de matricula. Nula quando a turma nao esta no catalogo turma -> escola.

  - name: int_educacao__avaliacao_enriquecida
    description: >
      Avaliacao bimestral com escola, faixa etaria e flags de politica (limites em vars).
      Grao: aluno x turma x bimestre, identico ao stg_educacao__avaliacao.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_aluno, id_turma, bimestre]
      - dbt_utils.equal_rowcount:          # os joins nao duplicaram nem perderam linhas
          arguments:
            compare_model: ref('stg_educacao__avaliacao')
    columns:
      - name: id_escola_turma_avaliada
        description: 'Candidata 1: escola da turma em que o aluno foi avaliado (ponte turma -> escola).'
        data_tests:
          # validador de chaves: as duas rotas validas devem apontar a mesma escola (hoje 98,7%); queda indica chave quebrada na carga
          - concordancia_minima:
              arguments:
                coluna_comparacao: id_escola_turma_matricula
                minimo_pct: 95
      - name: id_escola_turma_matricula
        description: 'Candidata 2: escola da turma de matricula do aluno (ponte turma -> escola).'
      - name: id_escola
        description: "Escola pela turma avaliada; na falta, pela turma de matricula. Nula = nao identificada com seguranca (18,7% das linhas)."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_educacao__escola')
                field: id_escola
      - name: origem_escola
        description: "'turma_avaliada' | 'turma_matricula' | nulo (escola nao identificada)."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - turma_avaliada
                  - turma_matricula
      - name: faixa_etaria
        data_tests:
          - not_null
      - name: avaliado_fora_da_turma_matricula
        description: "TRUE se a turma avaliada difere da turma de matricula (troca de turma)."
      - name: frequencia_bimestre_pct
        description: "Frequencia do bimestre, 0 a 100."
      - name: abaixo_minimo_legal
        description: "Frequencia abaixo de var('limite_frequencia_legal') (padrao 75, LDB art. 24, VI)."
      - name: em_absenteismo_cronico
        description: "Frequencia abaixo de var('limite_absenteismo_cronico') (padrao 90 = faltou 10% ou mais)."
      - name: faltas_estimadas_bimestre
        description: "(100 - frequencia)% x var('dias_letivos_bimestre'). Estimativa: os dados nao trazem a contagem de faltas."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 50     # = var('dias_letivos_bimestre')
      - name: qtd_disciplinas_com_nota
        description: "Quantas disciplinas tem nota no bimestre (0 a 4; disciplina_3 e sempre nula)."
      - name: nota_media_bimestre
        description: "Media simples das notas nao nulas do bimestre (com ruido de anonimizacao)."
      - name: tem_nota_baixa
        description: "TRUE se alguma disciplina < var('limite_nota_baixa'). Nulo se nao ha nenhuma nota."

  - name: int_educacao__aluno_bimestre
    description: >
      Trajetoria do aluno por bimestre: pior caso quando ha 2 turmas no mesmo bimestre,
      frequencia e faltas acumuladas, variacao em relacao ao bimestre anterior.
      Grao: aluno x bimestre.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_aluno, bimestre]
    columns:
      - name: id_escola
        description: "Escola do registro com menor frequencia no bimestre entre os que tem escola (pior caso). Nula se nenhum tem escola identificada."
      - name: qtd_turmas_no_bimestre
        description: "1 = normal; 2+ = aluno avaliado em mais de uma turma no bimestre."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: frequencia_acumulada_pct
        description: "Media das frequencias bimestrais ate este bimestre (premissa: bimestres de mesmo tamanho)."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: faltas_estimadas_acumuladas
        description: "Soma das faltas estimadas ate este bimestre."
      - name: variacao_frequencia_pp
        description: "Frequencia do bimestre menos a do bimestre imediatamente anterior (nulo se nao houver)."
      - name: nota_media_baixa
        description: "Media do bimestre abaixo de var('limite_nota_baixa'). Usada na regra do alerta."
      - name: tem_disciplina_abaixo_limite
        description: "Alguma disciplina abaixo do limite. Informativa: atinge ~30% ate de quem tem 95-100% de frequencia."
